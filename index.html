<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GUR" />
    <meta name="format-detection" content="telephone=no" />
    <title>GUR — Restoran Keşif Platformu</title>
    <meta name="description" content="GUR — İstanbul için Tinder-tarzı restoran keşif platformu" />
    <meta property="og:title" content="GUR — Restoran Keşif Platformu" />
    <meta property="og:description" content="GUR — İstanbul için Tinder-tarzı restoran keşif platformu" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      body { font-family: 'Poppins', system-ui, sans-serif; background: #0d0d1a; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Apple tarzı dokunma: gecikmesiz (300ms yok), basar basmaz küçülür, bırakınca yaylanarak döner */
      button, a, [role="button"], input, select, textarea, label { touch-action: manipulation; }
      button, [role="button"], a { -webkit-touch-callout: none; transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s; }
      button:active:not(:disabled), [role="button"]:active, a:active { transform: scale(.96); opacity: .9; transition-duration: .08s; }
      @media (hover: none) { button, a, [role="button"] { -webkit-user-select: none; user-select: none; } input, textarea { -webkit-user-select: text; user-select: text; } }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
